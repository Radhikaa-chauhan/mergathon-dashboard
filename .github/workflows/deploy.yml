name: Deploy Mergathon Dashboard to Netlify

on:
  push:
    branches:
      - main
  # Trigger when the scheduled leaderboard updater finishes, to ensure live data is updated
  workflow_run:
    workflows: ["Update Mergathon Leaderboard"]
    types:
      - completed
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: "netlify-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only run on push, manual dispatch, or if the updater workflow succeeded
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Dashboard
        run: npm run build

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=out --prod --message "Deploy from GitHub Actions (Commit ${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
